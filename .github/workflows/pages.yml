name: Publish lab site

on:
  push:
    branches: [main]
    paths:
      - "inventory/**"
      - "eworkbench/**"
      - "projects/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      # Build the TypeScript/Vite CircuitJS1 app in Actions rather than
      # checking generated JS assets into jmbjr/lab. The upstream source
      # is copied to the site only after compilation; see eworkbench/README.md.
      - name: Checkout CircuitJS1
        uses: actions/checkout@v4
        with:
          repository: pfalstad/circuitjs1
          ref: master
          path: _circuitjs_source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: _circuitjs_source/ts/package-lock.json

      - name: Disable optional upstream third-party widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_circuitjs_source/ts/circuitjs.html")
          # The optional Dropbox widget is not needed for local draft/export.
          # Upstream's root-scoped manifest is inappropriate under /lab/.
          p.write_text("\n".join(line for line in p.read_text().splitlines()
            if 'dropbox.com/static/api/2/dropins.js' not in line
            and 'href="/circuit/manifest.json"' not in line) + "\n")
          PY

      - name: Build CircuitJS1
        working-directory: _circuitjs_source/ts
        run: |
          npm ci
          npm run build
          test -f dist/circuitjs.html

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/eworkbench/vendor/circuitjs
          # Keep the historical inventory page at the site root.
          cp -a inventory/. _site/
          cp -a eworkbench/. _site/eworkbench/
          mkdir -p _site/projects
          cp -a projects/. _site/projects/
          cp -a _circuitjs_source/ts/dist/. _site/eworkbench/vendor/circuitjs/
          cp _circuitjs_source/README.md _site/eworkbench/vendor/circuitjs/UPSTREAM-README.md
          git -C _circuitjs_source rev-parse HEAD > _site/eworkbench/vendor/circuitjs/UPSTREAM-COMMIT.txt
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/eworkbench/index.html
          test -f _site/projects/todo/TODO-001/todo.json
          test -f _site/eworkbench/vendor/circuitjs/circuitjs.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete lab site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
