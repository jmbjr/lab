<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="720" viewBox="0 0 1000 720">
<title id="title">Provisional 20-contact JieLi U1 symbol and positional pad map</title>
<desc id="desc">Generic QFN-like U1 symbol with five approximate contacts along each of four sides. T1–T5, R1–R5, B1–B5, L1–L5 are positional labels, not manufacturer pin numbers. One continuity-proven connection called JL-A exists but its physical pad position remains unknown.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#23344a}.pad{fill:#8ba9c1;stroke:#315878;stroke-width:1.5}.pin{font-size:17px;fill:#334b65;font-weight:700}.label{font-size:20px;font-weight:750}.small{font-size:17px;fill:#56697b}.caps{font-size:14px;font-weight:750;letter-spacing:1px;fill:#45749b}.box{stroke:#86a5c0;stroke-width:2;fill:#eff7fd}</style>
<rect width="1000" height="720" fill="#f7f9fc"/>
<text x="30" y="40" class="label" style="font-size:28px">U1 — provisional JieLi IC pin map</text>
<text x="30" y="70" class="small">Physical top view · approx. 5 contacts/side · pad count and orientation must be verified</text>
<rect x="302" y="150" width="396" height="338" rx="12" fill="#e8f1fb" stroke="#315878" stroke-width="4"/>
<rect x="335" y="132" width="24" height="18" class="pad"/><text x="347" y="123" text-anchor="middle" class="pin">T1</text>
<rect x="335" y="488" width="24" height="18" class="pad"/><text x="347" y="528" text-anchor="middle" class="pin">B1</text>
<rect x="283" y="189" width="19" height="22" class="pad"/><text x="272" y="206" text-anchor="end" class="pin">L1</text>
<rect x="698" y="189" width="19" height="22" class="pad"/><text x="728" y="206" class="pin">R1</text>
<rect x="412" y="132" width="24" height="18" class="pad"/><text x="424" y="123" text-anchor="middle" class="pin">T2</text>
<rect x="412" y="488" width="24" height="18" class="pad"/><text x="424" y="528" text-anchor="middle" class="pin">B2</text>
<rect x="283" y="249" width="19" height="22" class="pad"/><text x="272" y="266" text-anchor="end" class="pin">L2</text>
<rect x="698" y="249" width="19" height="22" class="pad"/><text x="728" y="266" class="pin">R2</text>
<rect x="489" y="132" width="24" height="18" class="pad"/><text x="501" y="123" text-anchor="middle" class="pin">T3</text>
<rect x="489" y="488" width="24" height="18" class="pad"/><text x="501" y="528" text-anchor="middle" class="pin">B3</text>
<rect x="283" y="309" width="19" height="22" class="pad"/><text x="272" y="326" text-anchor="end" class="pin">L3</text>
<rect x="698" y="309" width="19" height="22" class="pad"/><text x="728" y="326" class="pin">R3</text>
<rect x="566" y="132" width="24" height="18" class="pad"/><text x="578" y="123" text-anchor="middle" class="pin">T4</text>
<rect x="566" y="488" width="24" height="18" class="pad"/><text x="578" y="528" text-anchor="middle" class="pin">B4</text>
<rect x="283" y="369" width="19" height="22" class="pad"/><text x="272" y="386" text-anchor="end" class="pin">L4</text>
<rect x="698" y="369" width="19" height="22" class="pad"/><text x="728" y="386" class="pin">R4</text>
<rect x="643" y="132" width="24" height="18" class="pad"/><text x="655" y="123" text-anchor="middle" class="pin">T5</text>
<rect x="643" y="488" width="24" height="18" class="pad"/><text x="655" y="528" text-anchor="middle" class="pin">B5</text>
<rect x="283" y="429" width="19" height="22" class="pad"/><text x="272" y="446" text-anchor="end" class="pin">L5</text>
<rect x="698" y="429" width="19" height="22" class="pad"/><text x="728" y="446" class="pin">R5</text>
<circle cx="329" cy="177" r="8" fill="#da9e61"/>
<text x="349" y="182" class="small" style="font-size:13px">visible dot — pin 1 not established</text>
<text x="500" y="284" text-anchor="middle" class="label" style="font-size:35px">JL / JieLi</text>
<text x="500" y="323" text-anchor="middle" class="label">U1 · 2.4 GHz audio SoC</text>
<text x="500" y="354" text-anchor="middle" class="small">Candidate family: AC7006</text>
<text x="500" y="384" text-anchor="middle" class="small">Exact suffix / actual pinout: UNKNOWN</text>
<rect x="374" y="408" width="255" height="47" rx="8" fill="#fff4e5" stroke="#d5ac66"/>
<text x="502" y="435" text-anchor="middle" style="font-size:15px;font-weight:bold">NO FUNCTIONAL PINS ASSIGNED</text>
<rect x="748" y="249" width="223" height="153" rx="9" fill="#fff4e5" stroke="#d5ac66" stroke-width="2"/>
<text x="765" y="279" class="label">JL-A · located by</text>
<text x="765" y="306" class="label">continuity</text>
<text x="765" y="338" class="small">Connected to C1R.2</text>
<text x="765" y="363" class="small">Which physical pad?</text>
<text x="765" y="385" class="small" style="font-weight:750">NOT YET RECORDED</text>
<path d="M748 322 H732" stroke="#c08c47" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="30" y="586" class="caps">CONFIDENCE LEGEND</text>
<rect x="30" y="608" width="15" height="15" fill="#8ba9c1"/><text x="56" y="622" class="small">Estimated pad position — label purely positional</text>
<rect x="30" y="644" width="15" height="15" fill="#ffe0b2"/><text x="56" y="658" class="small">Function or exact pad unresolved</text>
<text x="30" y="692" class="small">Do not transfer a 32-pin AC7006D datasheet numbering to this estimated 20-contact package.</text>
</svg>